# Prometheus configuration for the monitoring platform.
# Targets are the services' internal management ports (never exposed through Nginx).

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]

  - job_name: worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
