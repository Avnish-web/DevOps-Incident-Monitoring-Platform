# Locations shared by the HTTP and HTTPS server blocks.

root /usr/share/nginx/html;
limit_conn conn_per_ip 50;

# Only the methods the application uses.
if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) {
    return 405;
}

# --- API ----------------------------------------------------------------------------------
location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# Errors produced by Nginx itself for /api (rate limit, API down) in the API's JSON format.
location @api_too_many_requests {
    default_type application/problem+json;
    add_header Retry-After 10 always;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests. Slow down and retry shortly.","requestId":"$request_id"}';
}
location @api_unavailable {
    default_type application/problem+json;
    add_header Retry-After 10 always;
    return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The API is temporarily unavailable. Please retry shortly.","requestId":"$request_id"}';
}

# --- Never exposed ------------------------------------------------------------------------
location ~ ^/(actuator|\.git|\.env) {
    return 404;
}

# --- Dashboard ----------------------------------------------------------------------------
# Hashed build assets never change: cache aggressively.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# SPA routes (e.g. /monitors/123) fall back to index.html, which must not be cached.
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
