# Proxy settings for /api. The API sets its own security headers (strict CSP, nosniff,
# frame denial, no-store); Nginx only adds HSTS here to avoid duplicate headers.

proxy_pass http://api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $original_scheme;
# Correlate proxy and API logs: the API echoes a valid X-Request-Id.
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
proxy_buffering on;
proxy_hide_header X-Powered-By;

add_header Strict-Transport-Security $hsts_header always;

# Serve Nginx-generated errors as Problem Details, but pass API responses through untouched.
proxy_intercept_errors off;
error_page 429 = @api_too_many_requests;
error_page 502 503 504 = @api_unavailable;
