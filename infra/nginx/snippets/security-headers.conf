# Security headers for the dashboard (HTML and static assets).
# Nginx drops server-level add_header directives in any location that defines its own, so each
# location that sets headers includes this file.
#
# CSP: everything from our own origin only. The Vite build has no inline scripts. React and
# Recharts set inline style *attributes*, hence style-src-attr 'unsafe-inline' (no inline <style>
# or <script> elements are allowed).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security $hsts_header always;
