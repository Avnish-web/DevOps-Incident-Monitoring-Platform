# Main Nginx configuration for the web container (unprivileged: uid 101, port 8080).
# All writable paths live under /tmp so the container can run with a read-only root filesystem.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access log, consistent with the services' structured logs.
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 30s;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
