# Main Nginx configuration for the web container (unprivileged: uid 101, port 8080/8443).
# All writable paths live under /tmp so the container can run with a read-only root filesystem.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Client IP -----------------------------------------------------------------------
    # Behind a load balancer (e.g. AWS ALB inside the VPC), use the forwarded client address.
    # Only private ranges are trusted, so a direct client cannot spoof X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Original scheme: the load balancer's X-Forwarded-Proto if present, else our own.
    map $http_x_forwarded_proto $original_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    # HSTS only for HTTPS requests (browsers ignore it over HTTP; sending it there is noise).
    map $original_scheme $hsts_header {
        https   "max-age=63072000; includeSubDomains";
        default "";
    }

    # --- Logging -------------------------------------------------------------------------
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # --- Hardening -----------------------------------------------------------------------
    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    sendfile   on;
    tcp_nopush on;

    # --- Compression ---------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/problem+json
               image/svg+xml text/plain;

    # --- Rate limiting (per client IP, shared across worker processes) --------------------
    # General API traffic: generous, stops floods and scrapers.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Login: strict, in front of the API's own per-account/per-IP lockout.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
