# Single entry point: the SPA at /, the REST API at /api. Management ports are never proxied.

upstream api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlate proxy and API logs: the API echoes a valid X-Request-Id.
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    location /actuator {
        return 404;
    }

    # Hashed build assets never change: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes (e.g. /monitors/123) fall back to index.html, which must not be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
