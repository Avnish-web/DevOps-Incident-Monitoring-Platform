# HTTP entry point. Used directly for local development, and behind a TLS-terminating load
# balancer in production (HSTS is still sent when X-Forwarded-Proto is https).
# For self-hosted TLS, see tls.conf.example and docker-compose.tls.yml.

upstream api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    include /etc/nginx/snippets/app.conf;
}
