spring:
  application:
    name: monitoring-api
  lifecycle:
    # Max time to let in-flight requests finish on shutdown (SIGTERM).
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:monitoring}
    username: ${POSTGRES_USER:monitoring}
    # Intentionally no default: startup fails fast if the password is not provided.
    password: ${POSTGRES_PASSWORD}
    hikari:
      pool-name: api-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000 # ms
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    # The API is the only service that migrates the schema (see docs/architecture.md §4).
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Reject unexpected fields (e.g. "id", "status") instead of silently ignoring them.
      fail-on-unknown-properties: true

monitoring:
  alerting:
    # AES-256 key (base64, 32 bytes) encrypting alert channel targets at rest.
    # Must be identical for the API and the worker. Generate: openssl rand -base64 32
    encryption-key: ${ALERT_ENCRYPTION_KEY:}
  targets:
    # SSRF protection: keep false unless you intentionally monitor internal services.
    allow-private-addresses: ${MONITORING_ALLOW_PRIVATE_TARGETS:false}

server:
  port: ${API_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    # Reject oversized request bodies early; monitor definitions are small JSON documents.
    max-swallow-size: 1MB
    max-http-form-post-size: 1MB

management:
  # Actuator runs on a separate internal port that is never routed through the reverse proxy.
  server:
    port: ${API_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Not ready to receive traffic without the database. Liveness deliberately excludes
        # it so a database outage does not cause restart loops.
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Fixed buckets keep histogram cardinality small and match typical API SLOs.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

logging:
  # JSON (Elastic Common Schema) to stdout by default; MDC fields such as requestId are included.
  structured:
    format:
      console: ecs
