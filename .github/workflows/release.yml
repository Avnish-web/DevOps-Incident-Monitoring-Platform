# Continuous delivery: version tags (v1.2.3) publish signed images to GitHub Container Registry.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Images: ghcr.io/<owner>/monitoring-{api,worker,web}:<version>, with SBOM and build provenance
# attestations, signed keylessly with Sigstore cosign (GitHub OIDC identity, no stored keys).
# Deployment to AWS consumes these images by digest (see deploy/terraform and docs/deployment.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless signing with cosign
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: backend
            dockerfile: backend/Dockerfile
            module: api
          - image: worker
            context: backend
            dockerfile: backend/Dockerfile
            module: worker
          - image: web
            context: .
            dockerfile: frontend/Dockerfile
            module: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/monitoring-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: MODULE=${{ matrix.module }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image by digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/monitoring-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
