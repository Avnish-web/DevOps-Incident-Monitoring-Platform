# Weekly dependency updates, grouped to keep the PR count manageable.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*"]
      testing:
        patterns: ["org.testcontainers*", "org.awaitility*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router"]
      tooling:
        patterns: ["vite", "vitest", "@vitejs/*", "eslint*", "@eslint/*", "typescript*", "@testing-library/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
