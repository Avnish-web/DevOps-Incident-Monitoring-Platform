# Monitoring Platform: complete local stack.
#
#   cp .env.example .env        # fill in every secret (see README)
#   docker compose up -d --build
#   open http://localhost:8080  # dashboard; Grafana http://localhost:3000
#
# Development extras: docker compose --profile dev up -d   (adds Mailpit on :8025)
#
# Networks
#   data   internal-only: PostgreSQL and Redis are unreachable from outside Docker, and have
#          no internet access themselves.
#   edge   everything that needs a published port or outbound internet (checks, alerts).
name: monitoring

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  stop_grace_period: 30s
  pids_limit: 512

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  ALERT_ENCRYPTION_KEY: ${ALERT_ENCRYPTION_KEY:?set ALERT_ENCRYPTION_KEY in .env}
  MONITORING_ALLOW_PRIVATE_TARGETS: ${MONITORING_ALLOW_PRIVATE_TARGETS:-false}

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [data]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    <<: *hardening
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # Password required; no persistence needed (sessions and rate-limit counters are ephemeral).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    build:
      context: ./backend
      args:
        MODULE: api
    image: monitoring-api:local
    environment:
      <<: *db-env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    networks: [data, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  worker:
    <<: *app
    build:
      context: ./backend
      args:
        MODULE: worker
    image: monitoring-worker:local
    environment:
      <<: *db-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-25}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-monitoring@localhost}
    # edge: outbound internet for checks and alert webhooks.
    networks: [data, edge]
    depends_on:
      # The API owns schema migrations; the worker starts after they ran.
      api:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  web:
    <<: *app
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: monitoring-web:local
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    mem_limit: 128m
    healthcheck:
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first, Nginx listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # data: scrapes the services' internal management ports.
    networks: [data, edge]
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [data, edge]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Development-only SMTP catcher: e-mail alerts land in a web inbox at http://localhost:8025.
  # Point the worker at it with SPRING_MAIL_HOST=mailpit and SPRING_MAIL_PORT=1025.
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.2
    profiles: ["dev"]
    restart: unless-stopped
    networks: [edge]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

networks:
  data:
    internal: true
  edge: {}

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
